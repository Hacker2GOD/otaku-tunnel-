name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compiler dnstt-client (SlowDNS)
        continue-on-error: true
        run: |
          git clone https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt
          cd /tmp/dnstt/dnstt-client
          for pair in arm64:arm64-v8a amd64:x86_64 arm:armeabi-v7a; do
            arch=${pair%%:*}
            abi=${pair##*:}
            mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi"
            GOOS=linux GOARCH=$arch GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi/libdnstt.so" .
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - name: Cle de signature
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          fi
      - run: |
          mkdir -p dist
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64 --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/*-release.apk dist/
          flutter build apk --release --target-platform android-arm,android-arm64 --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-phones-universal-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OtakuTunnel-apk
          path: dist/*.apk
