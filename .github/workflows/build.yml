name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Compiler dnstt-client (SlowDNS)
        continue-on-error: true
        run: |
          git clone --depth 1 https://www.bamsoftware.com/git/dnstt.git /tmp/dnstt
          cd /tmp/dnstt/dnstt-client
          for pair in arm64:arm64-v8a amd64:x86_64; do
            arch=${pair%%:*}
            abi=${pair##*:}
            mkdir -p "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi"
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi/libdnstt.so" .
          done
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: OtakuTunnel-apk
          path: build/app/outputs/flutter-apk/*-release.apk
