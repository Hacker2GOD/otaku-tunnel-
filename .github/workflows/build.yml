name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64,android-x64 --split-debug-info=build/symbols
      - uses: actions/upload-artifact@v4
        with:
          name: OtakuTunnel-apk
          path: build/app/outputs/flutter-apk/*-release.apk
